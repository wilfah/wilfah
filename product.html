 <style>

 /* =========================================
 صور المنتج
 ========================================= */

.product-image-box {
 width: 100%;
 max-width: 500px;
 margin: auto;
 text-align: center;
 }

.product-main-image {
 width: 100%;
 aspect-ratio: 1 / 1;
 object-fit: cover;
 border-radius: 15px;
 cursor: pointer;
 display: block;
 }

.product-thumbnails {
 display: flex;
 gap: 10px;
 margin-top: 15px;
 overflow-x: auto;
 padding-bottom: 5px;
 justify-content: center;
 }

.product-thumbnail {
 width: 75px;
 height: 75px;
 object-fit: cover;
 border-radius: 10px;
 cursor: pointer;
 border: 2px solid transparent;
 transition: 0.2s;
 flex-shrink: 0;
 }

.product-thumbnail:hover {
 border-color: #333;
 }

.product-thumbnail.active {
 border-color: #333;
 }

 /* =========================================
 نافذة الصورة الكبيرة
 ========================================= */

.image-modal {
 display: none;
 position: fixed;
 inset: 0;
 background: rgba(0, 0, 0, 0.85);
 z-index: 9999;
 align-items: center;
 justify-content: center;
 padding: 20px;
 }

.image-modal.active {
 display: flex;
 }

.image-modal img {
 max-width: 90%;
 max-height: 85vh;
 object-fit: contain;
 border-radius: 10px;
 }

.image-modal-close {
 position: absolute;
 top: 20px;
 right: 30px;
 color: white;
 font-size: 40px;
 cursor: pointer;
 line-height: 1;
 }

 /* =========================================
 الجوال
 ========================================= */

 @media (max-width: 700px) {

.product-image-box {
 width: 100%;
 }

.product-main-image {
 aspect-ratio: 1 / 1;
 }

.product-thumbnails {
 justify-content: flex-start;
 }

.product-thumbnail {
 width: 65px;
 height: 65px;
 }

 }

 </style>

<script>

/* =========================================
 بيانات المنتجات والأسعار
========================================= */

const products = {

 blanket: {

 name: "بطانية بوفي",

 images: [
 "blanket.jpg",
 "blanket-2.jpg",
 "blanket-3.jpg",
 "blanket-4.jpg"
 ],

 image: "blanket.jpg",

 description:

 "الخامة: خيوط البوفي (حياكة يدوية 100%).<br><br>" +

 "مرفق مع كل طلب كرت خاص يحتوي على إرشادات العناية الكاملة.<br>" +

 "(لتنفيذ طلبكم بألوان خاصة ومقاسات معينة، الرجاء التواصل معنا عبر الواتساب)",

 sizes: [

 {
 name: "90 × 90 سم",
 price: 142
 },

 {
 name: "120 × 110 سم",
 price: 225
 },

 {
 name: "120 × 160 سم",
 price: 340
 }

 ]

 },

 shawl: {

 name: "شال بوفي",

 images: [
 "shawl.jpg",
 "shawl-2.jpg",
 "shawl-3.jpg"
 ],

 image: "shawl.jpg",

 description:

 "شال بوفي ناعم ومريح، ويمكن تخصيصه بإضافاتك المفضلة.<br><br>" +

 "الخامة: خيوط البوفي (حياكة يدوية 100%).<br><br>" +

 "مرفق مع كل طلب كرت خاص يحتوي على إرشادات العناية الكاملة.<br>" +

 "(لتنفيذ طلبكم بألوان خاصة ومقاسات معينة، الرجاء التواصل معنا عبر الواتساب)",

 sizes: [

 {
 name: "60 × 140 سم",
 price: 150
 }

 ]

 },

 gift: {

 name: "تغليف مع بطاقة إهداء",

 price: 10,

 images: [
 "gift.jpg",
 "boket.jpg",
 "gift1.jpg"

 ],

 image: "gift1.jpg",

 description:

 "تغليف أنيق يُقدّم على هيئة باقة باستخدام ورق تغليف فاخر، مع كرت إهداء خاص يمكنك إضافة رسالتك إليه.<br><br>" +

 "مرفق مع كل طلب كرت خاص يحتوي على إرشادات العناية الكاملة.<br>" +

 "(لتنفيذ طلبكم بألوان خاصة ومقاسات معينة، الرجاء التواصل معنا عبر الواتساب)",

 sizes: []

 },

 "colorful-shawl": {

 name: "شال بوفي ملون",

 images: [
 "colorful-shawl.jpg",
 "colorful-shawl-2.jpg",
 "color1.JPG"
 ],

 image: "colorful-shawl.jpg",

 description:

 "شال بوفي ملون بتصميم مميز يجمع بين ثلاثة ألوان من اختيارك، ليمنحك قطعة فريدة تناسب ذوقك.<br><br>" +

 "الخامة: خيوط البوفي (حياكة يدوية 100%).<br><br>" +

 "مرفق مع كل طلب كرت خاص يحتوي على إرشادات العناية الكاملة.<br>" +

 "(لتنفيذ طلبكم بألوان خاصة ومقاسات معينة، الرجاء التواصل معنا عبر الواتساب)",

 sizes: [

 {
 name: "65 × 140 سم",
 price: 180
 }

 ]

 }

};

/* =========================================
 قراءة المنتج من الرابط
========================================= */

const urlParams =
 new URLSearchParams(window.location.search);

const productId = urlParams.get("id") || urlParams.get("product");

const product =
 products[productId];

/* =========================================
 عناصر الصفحة
========================================= */

const productColorOption =
 document.getElementById("product-color-option");

const productSizeOption =
 document.getElementById("product-size-option");

const productSize =
 document.getElementById("product-size");

const customizationOptions =
 document.getElementById("customization-options");

const colorfulShawlOptions =
 document.getElementById("colorful-shawl-options");

const giftNoteOption =
 document.getElementById("gift-note-option");

/* =========================================
 السعر الأساسي
========================================= */

let selectedSizePrice = 0;

/* =========================================
 عرض بيانات المنتج
========================================= */

if (!product) {

 alert("لم يتم العثور على المنتج.");

} else {

 document.getElementById("product-name").textContent =
 product.name;

 document.getElementById("product-description").innerHTML =
 product.description;

 const mainProductImage =
 document.getElementById("product-image");

 const thumbnailsContainer =
 document.getElementById("product-thumbnails");

 mainProductImage.src =
 product.images[0];

 mainProductImage.alt =
 product.name;

 thumbnailsContainer.innerHTML = "";

 product.images.forEach(function(image, index) {

 const thumbnail =
 document.createElement("img");

 thumbnail.src =
 image;

 thumbnail.alt =
 product.name + " - صورة " + (index + 1);

 thumbnail.className =
 "product-thumbnail";

 if (index === 0) {

 thumbnail.classList.add("active");

 }

 thumbnail.addEventListener("click", function() {

 mainProductImage.src =
 image;

 document
.querySelectorAll(".product-thumbnail")
.forEach(function(item) {

 item.classList.remove("active");

 });

 thumbnail.classList.add("active");

 });

 thumbnailsContainer.appendChild(thumbnail);

 });

 if (product.sizes.length > 0) {

 productSize.innerHTML = `

 <option value="">
 المقاس
 </option>

 `;

 product.sizes.forEach(function(size) {

 const option =
 document.createElement("option");

 option.value =
 size.name;

 option.textContent =
 size.name;

 option.dataset.price =
 size.price;

 productSize.appendChild(option);

 });

 }

 if (productId === "gift") {

 productColorOption.style.display =
 "none";

 productSizeOption.style.display =
 "none";

 customizationOptions.style.display =
 "none";

 giftNoteOption.style.display =
 "block";

 selectedSizePrice =
 product.price;

 document.getElementById("product-price").textContent =
 product.price;

 document.getElementById("total-price").textContent =
 product.price;

 }

 else if (productId === "colorful-shawl") {

 productColorOption.style.display =
 "none";

 colorfulShawlOptions.style.display =
 "block";

 }

 else {

 productColorOption.style.display =
 "block";

 }

}

productSize.addEventListener(
 "change",
 function() {

 const selectedOption =
 productSize.options[
 productSize.selectedIndex
 ];

 if (
 !selectedOption ||
 !selectedOption.dataset.price
 ) {

 selectedSizePrice = 0;

 document.getElementById("product-price").textContent =
 "0";

 } else {

 selectedSizePrice =
 Number(selectedOption.dataset.price);

 document.getElementById("product-price").textContent =
 selectedSizePrice;

 }

 updateTotalPrice();

 }
);

/* =========================================
 أسعار الإضافات
========================================= */

const optionPrices = {

 stars: 1,    // 1 ر.س للحبة

 hearts: 0.5, // 0.5 ر.س للحبة (0.5 للحبة)

 letters: 5   // 5 ر.س للحرف

};

let options = {

 stars: 0,

 hearts: 0,

 letters: 0

};

function changeOptionQuantity(option, amount) {

 options[option] += amount;

 if (options[option] < 0) {

 options[option] = 0;

 }

 document.getElementById(
 option + "-quantity"
 ).textContent =
 options[option];

 if (option === "stars") {

 const box =
 document.getElementById("stars-color-box");

 if (options.stars > 0) {

 box.style.display = "block";

 } else {

 box.style.display = "none";

 document.getElementById("stars-color").value =
 "";

 }

 }

 if (option === "hearts") {

 const box =
 document.getElementById("hearts-color-box");

 if (options.hearts > 0) {

 box.style.display = "block";

 } else {

 box.style.display = "none";

 document.getElementById("hearts-color").value =
 "";

 }

 }

 if (option === "letters") {

 const details =
 document.getElementById("letters-details");

 if (options.letters > 0) {

 details.style.display = "block";

 } else {

 details.style.display = "none";

 document.getElementById("letters-color").value =
 "";

 document.getElementById("custom-letters").value =
 "";

 }

 }

 updateTotalPrice();

}

function changeProductQuantity(amount) {

 const quantityInput =
 document.getElementById("product-quantity");

 let quantity =
 parseInt(quantityInput.value) || 1;

 quantity += amount;

 if (quantity < 1) {

 quantity = 1;

 }

 quantityInput.value =
 quantity;

 updateTotalPrice();

}

function updateTotalPrice() {

 if (!product) {

 return;

 }

 const quantity =
 parseInt(
 document.getElementById("product-quantity").value
 ) || 1;

 let singleProductPrice =
 selectedSizePrice;

 if (productId === "gift") {

 singleProductPrice =
 product.price;

 }

 /* الإضافات تشمل البطانية، الشال العادي، والشال الملون */

 if (
 productId === "blanket" ||
 productId === "shawl" ||
 productId === "colorful-shawl"
 ) {

 const customizationPrice =

 (options.stars *
 optionPrices.stars)

 +

 (options.hearts *
 optionPrices.hearts)

 +

 (options.letters *
 optionPrices.letters);

 singleProductPrice +=
 customizationPrice;

 }

 const total =
 singleProductPrice * quantity;

 document.getElementById("total-price").textContent =
 total;

}

function addProductToCart() {

 if (!product) {

 alert(
 "لم يتم العثور على المنتج."
 );

 return;

 }

 const quantity =
 parseInt(
 document.getElementById("product-quantity").value
 );

 if (!quantity || quantity < 1) {

 alert(
 "اختر كمية صحيحة."
 );

 return;

 }

 if (productId === "gift") {

 const giftNote =
 document.getElementById("gift-note").value.trim();

 if (!giftNote) {

 alert(
 "اكتب الرسالة التي تريد وضعها على كرت الإهداء."
 );

 return;

 }

 let cart =
 JSON.parse(
 localStorage.getItem("cart")
 ) || [];

 const existingProduct =
 cart.find(function(item) {

 return (

 item.name === product.name

 &&

 item.giftNote === giftNote

 );

 });

 if (existingProduct) {

 existingProduct.quantity +=
 quantity;

 } else {

 cart.push({

 name:
 product.name,

 price:
 product.price,

 basePrice:
 product.price,

 quantity:
 quantity,

 giftNote:
 giftNote

 });

 }
