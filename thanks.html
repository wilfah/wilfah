<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم استلام طلبك بنجاح | وِلفة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #faf9f6;
            color: #4c280c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .thanks-card {
            background: #ffffff;
            border: 1px solid #e5dccf;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
        }
        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #4c280c;
        }
        p {
            font-size: 15px;
            line-height: 1.8;
            color: #666;
            margin-bottom: 25px;
        }
        .order-info {
            background: #faf8f4;
            border: 1px dashed #d8cfc2;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #4c280c;
        }
        .btn-home {
            display: inline-block;
            background-color: #4c280c;
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }
        .btn-home:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="thanks-card">
        <div class="icon">🎉🎊</div>
        <h1>شكرًا لثقتكِ في وِلفة!</h1>
        <p>تم استلام طلبكِ بنجاح، ونسعد جدًا بخدمتكِ. سيتم مراجعة إيصال التحويل والتواصل معكِ قريبًا لتأكيد كافة التفاصيل.</p>
        
        <div class="order-info">
            ✨ سنحرص على تجهيز طلبكِ بحب وعناية فائقة!
        </div>
        <a href="index.html" class="btn-home">العودة للرئيسية 🛍️</a>
    </div>
</body>
</html>
